<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Upgrade – Zero Click Translate</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 12vh 24px 32px;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      main {
        box-sizing: border-box;
        width: min(380px, 100%);
        padding: 26px 26px 22px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 12px 40px rgba(15, 23, 42, 0.06);
      }
      .brand {
        margin: 0 0 16px;
        color: #94a3b8;
        font-size: 12px;
        font-weight: 600;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      .lead {
        margin: 0;
        color: #64748b;
      }
      .panel {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid #eef2f7;
      }
      .panel-label {
        margin: 0 0 4px;
        color: #94a3b8;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .panel-value {
        margin: 0;
        font-size: 15px;
      }
      .panel-reset {
        margin: 4px 0 0;
        color: #64748b;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Zero Click Translate</p>
      <h1>Upgrade</h1>
      <p class="lead">Pro adds extra characters to the monthly limit. Payments are not available yet.</p>
      <div class="panel">
        <p class="panel-label">Free continues</p>
        <p class="panel-value" id="limitLine">Monthly character limit</p>
        <p class="panel-reset" id="resetLine">Resets on the 1st at 00:00</p>
      </div>
    </main>
    <script src="entitlementManager.js"></script>
    <script src="quotaManager.js"></script>
    <script src="pricing.js"></script>
  </body>
</html>
