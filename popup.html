<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        box-sizing: border-box;
        width: 260px;
        padding: 8px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        color: #0f172a;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      select {
        flex: 1;
        min-width: 0;
        height: 28px;
        padding: 0 6px;
        border: 1px solid #d0d5dd;
        border-radius: 6px;
        background: #fff;
        color: inherit;
        font: inherit;
      }
      .swap {
        flex: none;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <select id="langA" aria-label="Language A"></select>
      <span class="swap">↔</span>
      <select id="langB" aria-label="Language B"></select>
    </div>
    <script src="langs.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
