<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        box-sizing: border-box;
        width: 260px;
        padding: 8px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        color: #0f172a;
      }
      .power {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        cursor: pointer;
        user-select: none;
      }
      .power input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .switch {
        width: 36px;
        height: 20px;
        border-radius: 999px;
        background: #d0d5dd;
        position: relative;
        flex: none;
        transition: background 0.15s ease;
      }
      .switch::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.2);
        transition: left 0.15s ease;
      }
      .power input:checked + .switch {
        background: #2563eb;
      }
      .power input:checked + .switch::after {
        left: 18px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      select {
        flex: 1;
        min-width: 0;
        height: 28px;
        padding: 0 4px;
        border: 1px solid #d0d5dd;
        border-radius: 6px;
        background: #fff;
        color: inherit;
        font: inherit;
      }
      .swap {
        flex: none;
        color: #64748b;
      }
      .quota {
        flex: none;
        color: #94a3b8;
        font-size: 11px;
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .quota-hint {
        margin-top: 4px;
        color: #94a3b8;
        font-size: 11px;
      }
      .quota-hint[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <label class="power">
      <span id="powerLabel">Translate</span>
      <input id="enabled" type="checkbox" checked />
      <span class="switch"></span>
    </label>
    <div class="row">
      <select id="langA" aria-label="Language A"></select>
      <span class="swap">↔</span>
      <select id="langB" aria-label="Language B"></select>
      <span class="quota" id="quotaCount">0 / 10,000</span>
    </div>
    <div class="quota-hint" id="quotaHint" hidden>Running low this month</div>
    <script src="entitlementManager.js"></script>
    <script src="quotaManager.js"></script>
    <script src="langs.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
