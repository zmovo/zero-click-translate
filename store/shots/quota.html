<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zero Click Translate — quota</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        color: #0f172a;
        background: #fff;
      }
      .chrome {
        display: flex;
        align-items: center;
        height: 52px;
        padding: 0 16px;
        background: #f1f5f9;
        border-bottom: 1px solid #e2e8f0;
        color: #64748b;
        font-size: 13px;
      }
      .article {
        position: relative;
        padding: 64px 88px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 32px;
        letter-spacing: -0.03em;
      }
      p {
        max-width: 560px;
        color: #334155;
        font-size: 18px;
      }
      mark {
        background: #d8e8e2;
      }
      .zct-card {
        position: absolute;
        left: 720px;
        top: 210px;
        box-sizing: border-box;
        width: 260px;
        padding: 14px 14px 12px;
        border: 1px solid rgba(15, 23, 42, 0.12);
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 8px 28px rgba(15, 23, 42, 0.16);
      }
      .zct-badge {
        margin-bottom: 2px;
        font-size: 13px;
        font-weight: 600;
      }
      .zct-body {
        color: #64748b;
        font-size: 12px;
      }
      .zct-action {
        display: block;
        margin-top: 12px;
        padding: 6px 12px;
        border-radius: 8px;
        background: #2f5d62;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        text-align: center;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="chrome">https://claude.ai</div>
    <div class="article">
      <h1>Free monthly limit</h1>
      <p>
        When the 10,000 character quota is used up, the same card explains the reset.
        <mark>Select more text and the Upgrade path stays one tap away.</mark>
      </p>
      <div class="zct-card">
        <div class="zct-badge">Free limit reached</div>
        <div class="zct-body">Resets on Oct 1 at 00:00</div>
        <a class="zct-action" href="#">Upgrade</a>
      </div>
    </div>
  </body>
</html>
