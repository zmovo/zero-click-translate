<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zero Click Translate — tile</title>
    <style>
      html,
      body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
        font: 16px/1.35 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        color: #fff;
        background: #1d4ed8;
      }
      .tile {
        box-sizing: border-box;
        width: 440px;
        height: 280px;
        padding: 28px 28px 24px;
        background: linear-gradient(160deg, #3b82f6 0%, #1d4ed8 70%);
      }
      .mark {
        width: 48px;
        height: 48px;
        margin-bottom: 18px;
        border-radius: 12px;
        background: #fff center/40px 40px no-repeat;
        background-image: url('../../icons/icon128.png');
      }
      h1 {
        margin: 0 0 8px;
        font-size: 26px;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        color: #dbeafe;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div class="tile">
      <div class="mark"></div>
      <h1>Zero Click Translate</h1>
      <p>Select text. The translation appears beside it.</p>
    </div>
  </body>
</html>
